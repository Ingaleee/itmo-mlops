apiVersion: v1
kind: ConfigMap
metadata:
  name: esolovev-iris-config
  namespace: mlops-students
  labels:
    app.kubernetes.io/instance: esolovev-iris
data:
  MODEL_VERSION: iris-v1
  MODEL_PATH: /app/model.joblib
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esolovev-iris
  namespace: mlops-students
  labels:
    app.kubernetes.io/name: iris-api
    app.kubernetes.io/instance: esolovev-iris
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: iris-api
      app.kubernetes.io/instance: esolovev-iris
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iris-api
        app.kubernetes.io/instance: esolovev-iris
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/ingaleee/esolovev-iris:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: esolovev-iris-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: esolovev-iris
  namespace: mlops-students
  labels:
    app.kubernetes.io/instance: esolovev-iris
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iris-api
    app.kubernetes.io/instance: esolovev-iris
  ports:
    - name: http
      port: 80
      targetPort: http
