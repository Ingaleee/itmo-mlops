name: ITMO MLOps labs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy both labs to the teaching cluster using KUBE_CONFIG_B64
        type: boolean
        default: false
      demonstrate_rollback:
        description: Demonstrate semantic failure and rollback, then restore the same digest
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mlops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_DRIVER: configmap
  KUBE_NAMESPACE: mlops-students
  RELEASE_PREFIX: esolovev
  IRIS_IMAGE: ghcr.io/ingaleee/esolovev-iris
  SEARCH_IMAGE: ghcr.io/ingaleee/esolovev-search
  PYTHONUTF8: '1'

jobs:
  test-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      index_version: ${{ steps.index.outputs.index_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - run: pip install -r lab2/requirements-dev.txt && pip check
      - name: Train Iris and verify API contract
        working-directory: lab1
        run: |
          python train.py
          python -m pytest -q --junitxml=evidence/tests.xml
          python scripts/check_api.py
      - name: Build retrieval index and test API
        id: index
        working-directory: lab2
        run: |
          python scripts/build_index.py --output artifacts
          python -m pytest -q --junitxml=evidence/tests.xml
          python scripts/check_quality.py
          python -c 'import json,os; from pathlib import Path; metadata=json.loads(Path("artifacts/metadata.json").read_text()); print("index_version="+metadata["index_version"],file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - name: Install verified Helm and kubectl
        run: bash scripts/install_ci_tools.sh
      - name: Audit pinned runtime dependencies
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit-env"
          "$RUNNER_TEMP/dependency-audit-env/bin/pip" install pip-audit==2.10.1
          "$RUNNER_TEMP/dependency-audit-env/bin/pip-audit" --no-deps --disable-pip -r lab1/requirements.lock -r lab2/requirements.lock --timeout 15 -f json -o lab2/evidence/dependency-audit.json
      - name: Check immutable chart and runtime protections
        working-directory: lab2
        run: python scripts/check_chart.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-and-contracts
          path: |
            lab1/evidence/
            lab2/evidence/
            lab2/artifacts/metadata.json

  build-images:
    needs: test-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      iris_digest: ${{ steps.iris.outputs.digest }}
      search_digest: ${{ steps.search.outputs.digest }}
      index_version: ${{ needs.test-quality.outputs.index_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Iris
        id: iris
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: lab1
          cache-from: type=gha,scope=iris
          cache-to: type=gha,scope=iris,mode=max
          sbom: true
          provenance: mode=max
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IRIS_IMAGE }}:${{ github.sha }}
            ${{ env.IRIS_IMAGE }}:v1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish Runbook Search
        id: search
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: lab2
          cache-from: type=gha,scope=search
          cache-to: type=gha,scope=search,mode=max
          sbom: true
          provenance: mode=max
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.SEARCH_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Save immutable release identifiers
        if: github.event_name != 'pull_request'
        env:
          IRIS_DIGEST: ${{ steps.iris.outputs.digest }}
          SEARCH_DIGEST: ${{ steps.search.outputs.digest }}
        run: |
          mkdir release
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('release/images.json').write_text(json.dumps({
              'build_revision': os.environ['GITHUB_SHA'],
              'iris': {'repository': os.environ['IRIS_IMAGE'], 'digest': os.environ['IRIS_DIGEST']},
              'search': {'repository': os.environ['SEARCH_IMAGE'], 'digest': os.environ['SEARCH_DIGEST']},
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: immutable-images
          path: release/images.json

  local-integration:
    if: github.event_name != 'pull_request'
    needs: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IRIS_DIGEST: ${{ needs.build-images.outputs.iris_digest }}
      IMAGE_REPOSITORY: ghcr.io/ingaleee/esolovev-search
      IMAGE_DIGEST: ${{ needs.build-images.outputs.search_digest }}
      BUILD_REVISION: ${{ github.sha }}
      INDEX_VERSION: ${{ needs.build-images.outputs.index_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - run: bash scripts/install_ci_tools.sh
      - name: Create isolated CI Kubernetes
        run: bash scripts/create_ci_cluster.sh
      - name: Verify published Iris image in Kubernetes
        run: bash scripts/deploy_iris.sh
      - name: Verify staging and production promotion
        working-directory: lab2
        run: |
          bash scripts/deploy_release.sh esolovev-search-staging staging normal
          bash scripts/deploy_release.sh esolovev-search-prod production normal
      - name: Verify semantic failure, rollback and identical digest
        working-directory: lab2
        run: |
          bash scripts/demonstrate_rollback.sh esolovev-search-prod production
          python scripts/check_promotion.py --digest "$IMAGE_DIGEST"
      - name: Capture own deployment diagnostics
        if: always()
        run: bash scripts/capture_diagnostics.sh
      - name: Summarize deployment evidence
        if: always()
        working-directory: lab2
        run: python scripts/write_summary.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: local-kubernetes-integration
          path: |
            lab1/evidence/
            lab2/evidence/
      - name: Remove isolated CI Kubernetes
        if: always()
        run: |
          "$RUNNER_TEMP/mlops-tools/k3d" cluster delete ci-labs
          rm -f "$RUNNER_TEMP/local-ci.kubeconfig"

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [build-images, local-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: esolovev-teaching-cluster-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - run: bash scripts/install_ci_tools.sh
      - name: Load masked kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: bash scripts/prepare_kubeconfig.sh
      - name: Deploy and verify Iris
        env:
          IRIS_DIGEST: ${{ needs.build-images.outputs.iris_digest }}
        run: bash scripts/deploy_iris.sh
      - name: Deploy and verify staging by digest
        working-directory: lab2
        env:
          IMAGE_REPOSITORY: ${{ env.SEARCH_IMAGE }}
          IMAGE_DIGEST: ${{ needs.build-images.outputs.search_digest }}
          BUILD_REVISION: ${{ github.sha }}
          INDEX_VERSION: ${{ needs.build-images.outputs.index_version }}
        run: bash scripts/deploy_release.sh esolovev-search-staging staging normal
      - name: Capture own deployment diagnostics
        if: always()
        run: bash scripts/capture_diagnostics.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: staging-and-iris-evidence
          path: |
            lab1/evidence/
            lab2/evidence/
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/mlops-students.kubeconfig" "$RUNNER_TEMP/kubeconfig-validation.json"

  promote-production:
    needs: [build-images, deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: esolovev-teaching-cluster-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - run: bash scripts/install_ci_tools.sh
      - name: Load masked kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: bash scripts/prepare_kubeconfig.sh
      - name: Promote the staging digest
        working-directory: lab2
        env:
          IMAGE_REPOSITORY: ${{ env.SEARCH_IMAGE }}
          IMAGE_DIGEST: ${{ needs.build-images.outputs.search_digest }}
          BUILD_REVISION: ${{ github.sha }}
          INDEX_VERSION: ${{ needs.build-images.outputs.index_version }}
        run: bash scripts/deploy_release.sh esolovev-search-prod production normal
      - name: Demonstrate semantic failure and verified rollback
        if: inputs.demonstrate_rollback
        working-directory: lab2
        env:
          IMAGE_REPOSITORY: ${{ env.SEARCH_IMAGE }}
          IMAGE_DIGEST: ${{ needs.build-images.outputs.search_digest }}
          BUILD_REVISION: ${{ github.sha }}
          INDEX_VERSION: ${{ needs.build-images.outputs.index_version }}
        run: |
          bash scripts/demonstrate_rollback.sh esolovev-search-prod production
      - name: Retrieve staging metadata and prove identical promotion
        working-directory: lab2
        env:
          IMAGE_DIGEST: ${{ needs.build-images.outputs.search_digest }}
          BUILD_REVISION: ${{ github.sha }}
          INDEX_VERSION: ${{ needs.build-images.outputs.index_version }}
        run: |
          python scripts/verify_release.py --release esolovev-search-staging --expected-digest "$IMAGE_DIGEST" --expected-build-revision "$BUILD_REVISION" --expected-index "$INDEX_VERSION" --expected-environment staging --output evidence/esolovev-search-staging/normal/candidate
          python scripts/check_promotion.py --digest "$IMAGE_DIGEST"
      - name: Capture own deployment diagnostics
        if: always()
        run: bash scripts/capture_diagnostics.sh
      - name: Summarize production evidence
        if: always()
        working-directory: lab2
        run: python scripts/write_summary.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-promotion-and-rollback
          path: lab2/evidence/
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/mlops-students.kubeconfig" "$RUNNER_TEMP/kubeconfig-validation.json"
