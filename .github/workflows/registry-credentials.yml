name: Iris registry credential store

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: esolovev-registry-credentials
  cancel-in-progress: false

jobs:
  verify-pass-login:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize isolated pass store
        run: bash scripts/setup_registry_pass.sh
      - name: Authenticate and verify encrypted storage
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p lab1/evidence/registry-credentials
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin > lab1/evidence/registry-credentials/login.log
          python3 scripts/verify_registry_pass.py
      - name: Pull the verified teaching Iris image
        run: |
          docker pull ghcr.io/ingaleee/esolovev-iris@sha256:bb255540fbd96a75acd40bd0f6c206c114591da75397f74b2359ce4b4b508e6b > lab1/evidence/registry-credentials/pull.log
      - name: Remove temporary credentials
        if: always()
        run: bash scripts/cleanup_registry_pass.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: registry-credential-evidence
          path: lab1/evidence/registry-credentials/
          if-no-files-found: error
